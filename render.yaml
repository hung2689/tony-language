databases:
  - name: language-learning-db
    databaseName: language_learning
    user: postgres
    region: singapore
    plan: free

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: language-learning-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: language-learning-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: APP_COOKIE_SAME_SITE
        value: None

  # 2. React + Vite Frontend Static Site
  - type: web
    name: language-learning-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: language-learning-backend
          property: host
