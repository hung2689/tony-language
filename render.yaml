services:
  # Spring Boot Backend Web Service on Render (Free Tier, Singapore)
  - type: web
    name: language-learning-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      # Neon PostgreSQL connection string (jdbc:postgresql://<neon-host>/language_learning?sslmode=require)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Allow requests from Vercel deployment and local dev
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      # Cross-site cookie support between Vercel and Render
      - key: APP_COOKIE_SAME_SITE
        value: None
      - key: DB_POOL_MAX
        value: "5"
