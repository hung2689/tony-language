# Dedicated test database: language_learning_test
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/language_learning_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Test profile JWT secret (guaranteed >= 32 bytes)
app.jwt.secret=test_jwt_secret_key_language_learning_app_minimum_256_bits_for_testing!
app.jwt.issuer=language-learning-test
app.cookie.secure=false

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
