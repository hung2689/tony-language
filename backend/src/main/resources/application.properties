spring.application.name=language-learning-backend

# JWT & Security Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=language-learning-app
app.jwt.access-token-expiration-seconds=900
app.jwt.refresh-token-expiration-days=30
app.jwt.refresh-grace-seconds=10
app.cookie.secure=false
app.cookie.same-site=Strict

# CORS (comma-separated). Local dev defaults; production overrides via CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Datasource: SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# env vars (Spring relaxed binding) take precedence over the DB_* fallbacks below.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/language_learning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Health endpoint (Actuator): only /actuator/health is exposed, without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Render (and most PaaS) inject PORT; fall back to 8080 locally.
server.port=${PORT:8080}
