spring.application.name=language-learning-backend

# JWT & Security Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=language-learning-app
app.jwt.access-token-expiration-seconds=900
app.jwt.refresh-token-expiration-days=14
app.jwt.refresh-grace-seconds=10
app.cookie.secure=false

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/language_learning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080