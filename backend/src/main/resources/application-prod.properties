# Production profile (activated with SPRING_PROFILES_ACTIVE=prod).
# All secrets come from environment variables - never hardcode them here.
#
# Required env vars:
#   SPRING_DATASOURCE_URL       jdbc:postgresql://<neon-host>/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   JWT_SECRET                  >= 32 bytes, random
# Optional:
#   CORS_ALLOWED_ORIGINS        e.g. https://your-app.vercel.app (comma-separated)
#   APP_COOKIE_SAME_SITE        Strict (default, when frontend proxies /api) or None (direct cross-site calls)
#   DB_POOL_MAX                 default 5

# No localhost origins in production. Empty = no cross-origin browser access.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Refresh-token cookie must be Secure over HTTPS.
app.cookie.secure=true
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Strict}

# Never fall back to a local database in production: fail fast if not configured.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Small pool for Neon free tier + Render free (512 MB). minimum-idle=0 lets the pool drain
# when idle so Neon compute can scale to zero.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.connection-timeout=30000

# Schema is managed by Flyway only. Never auto-create/drop.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

# Quiet logs, no SQL / stack traces leaked to clients.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Google Gemini AI Configuration
gemini.api.model=${GEMINI_MODEL:gemini-flash-lite-latest}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

# Running behind Render's HTTPS proxy.
server.forward-headers-strategy=framework
